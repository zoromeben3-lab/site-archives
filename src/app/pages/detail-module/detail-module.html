<a routerLink="/archives" class="retour">← Retour aux archives</a>

<h1>{{ module }}</h1>

<section class="bloc">
  <div class="onglets">
    @for (o of onglets; track o) {
      <button type="button" class="onglet"
              [class.actif]="o === ongletActif"
              (click)="ongletActif = o">
        {{ o }}
      </button>
    }
  </div>

  @for (r of resultats(); track r.id) {
    <article class="archive">
      <div class="archive-infos">
        <strong>{{ r.titre }}</strong>
        <small>{{ r.date }}</small>
      </div>
      <div class="archive-actions">
        <button type="button" class="bouton-apercu" (click)="apercu(r)">Aperçu</button>
        <button type="button" class="bouton" (click)="telecharger(r)">Télécharger</button>
      </div>
    </article>
  } @empty {
    <p class="vide">Aucune archive dans cette catégorie.</p>
  }
</section>
