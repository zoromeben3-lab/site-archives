<div class="cadre">

  <aside class="menu">
    <a routerLink="/tableau-de-bord" class="marque" title="Tableau de bord">
      <img src="/images/logo.png" alt="Logo U-AUBEN" class="logo">
      <strong>U-AUBEN</strong>
    </a>

    <nav>
      @for (l of menu; track l.lien) {
        <a [routerLink]="l.lien" routerLinkActive="actif">{{ l.texte }}</a>
      }
    </nav>

    <button type="button" class="deconnexion" (click)="deconnexion()">Déconnexion</button>
  </aside>

  <div class="droite">
    <header class="entete">
      <button type="button" class="cloche" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>

      <a routerLink="/mon-profil" class="utilisateur" title="Accéder à mon profil">
        <span class="avatar">{{ utilisateur.initiales }}</span>
        <div class="infos">
          <strong>{{ utilisateur.nom }}</strong>
          <small>{{ utilisateur.role }}</small>
        </div>
      </a>
    </header>

    <main class="contenu">
      <router-outlet />
    </main>
  </div>

</div>
